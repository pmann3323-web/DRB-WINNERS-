<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DRB WINNERS</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f1a;
      color: #e8ecf4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      max-width: 560px;
      margin: 24px;
      padding: 40px;
      border-radius: 16px;
      background: #131a2b;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    img.logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
    }
    p {
      margin: 0;
      line-height: 1.5;
      color: #a7b0c3;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/drb-winners-logo.jpg" alt="DRB WINNERS logo" />
    <h1>DRB WINNERS</h1>
    <p>
      This is the source repository for the DRB WINNERS tournament management app,
      an Android application. It has no web front end, so this site only
      publishes this placeholder page.
    </p>
  </div>
</body>
</html>
